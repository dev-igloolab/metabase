name: Publicar contenedor de IglooLab

on:
  push:
    branches:
      - igloolab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: igloolab-container
  cancel-in-progress: false

env:
  REGISTRY: registry.digitalocean.com
  IMAGE_NAME: igloosuite-repository/metabase
  METABASE_VERSION: v0.63.18

jobs:
  build-and-push:
    name: Compilar y publicar imagen
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MB_EDITION: oss
      INTERACTIVE: "false"
      CI: "true"

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Preparar frontend
        uses: ./.github/actions/prepare-frontend
        with:
          node-version: "22"

      - name: Preparar backend
        uses: ./.github/actions/prepare-backend
        with:
          java-version: "25"

      - name: Compilar Metabase
        run: ./bin/build.sh :version "\"${METABASE_VERSION}\""

      - name: Preparar el contexto del contenedor
        run: mv target/uberjar/metabase.jar bin/docker/metabase.jar

      - name: Instalar doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Iniciar sesión en DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Crear y publicar el contenedor
        uses: docker/build-push-action@v7
        with:
          context: bin/docker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.METABASE_VERSION }}-igloolab
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
